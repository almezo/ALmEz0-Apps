name: Build Apps (Android, iOS & Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. Android APK Build (Ubuntu runner)
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36'

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: npm run prepare:app

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package APK as ALmEz0.apk
        run: |
          mkdir -p apk-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} apk-output/ALmEz0.apk \;

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ALmEz0-Android-APK
          path: apk-output/ALmEz0.apk

  # -------------------------------------------------------------
  # 2. Windows EXE Build (Windows runner)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: npm run prepare:app

      - name: Build Windows Executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: ALmEz0-Windows-Installer
          path: |
            dist-electron/ALmEz0.exe

  # -------------------------------------------------------------
  # 3. iOS Project Build (macOS runner)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS Archive
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: npm run prepare:app

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Archive iOS Workspace
        run: |
          tar -czf AlMeZ0-iOS-Project.tar.gz ios/

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlMeZ0-iOS-Project
          path: AlMeZ0-iOS-Project.tar.gz

  # -------------------------------------------------------------
  # 4. Automatic GitHub Release (APK & EXE)
  # -------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ALmEz0-Android-APK
          path: release-assets

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: ALmEz0-Windows-Installer
          path: release-assets

      - name: Create or Update GitHub Release in Public Downloads Repo
        uses: softprops/action-gh-release@v2
        with:
          repository: almezo/ALmEz0-Downloads
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: latest
          name: "ALmEz0 Latest Release"
          body: |
            ## تحميل تطبيقات سيرفرات الميزو - ALmEz0

            - 📱 **تطبيق الأندرويد (APK)**: [ALmEz0.apk](https://github.com/almezo/ALmEz0-Downloads/releases/latest/download/ALmEz0.apk)
            - 💻 **برنامج الكمبيوتر (Windows EXE)**: [ALmEz0.exe](https://github.com/almezo/ALmEz0-Downloads/releases/latest/download/ALmEz0.exe)

            تحديث تلقائي مستمر مع كل إصدار جديد.
          files: |
            release-assets/ALmEz0.apk
            release-assets/ALmEz0.exe
