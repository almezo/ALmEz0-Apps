name: Build Apps (Android, iOS & Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. Android APK Build (Ubuntu runner)
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: npm run prepare:app

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AlMeZ0-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  # -------------------------------------------------------------
  # 2. Windows EXE Build (Windows runner)
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: npm run prepare:app

      - name: Build Windows Executables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: AlMeZ0-Windows-EXE
          path: |
            dist-electron/*.exe

  # -------------------------------------------------------------
  # 3. iOS Project Build (macOS runner)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS Archive
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: npm run prepare:app

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Archive iOS Workspace
        run: |
          tar -czf AlMeZ0-iOS-Project.tar.gz ios/

      - name: Upload iOS Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlMeZ0-iOS-Project
          path: AlMeZ0-iOS-Project.tar.gz
