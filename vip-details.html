<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <!-- Ultimate Cache Buster -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        if ('caches' in window) {
            caches.keys().then(function(k) {
                k.forEach(function(key) { caches.delete(key); });
            });
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" type="image/x-icon" href="photo/logo.ico">
    <link rel="apple-touch-icon" href="photo/logo.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=4091.0">
</head>

<body>

    <header>
        <div class="container header-flex">
            <a href="index.html" class="logo">

            <div class="contact-header">
                <button class="header-login-btn" id="headerLoginBtn" onclick="openLoginModal()">تسجيل الدخول</button>
                <script>
                    (function () {
                        try {
                            var cached = localStorage.getItem('almezo_cached_user') || sessionStorage.getItem('almezo_cached_user');
                            if (cached) {
                                var u = JSON.parse(cached);
                                if (u && u.name) {
                                    var b = document.getElementById('headerLoginBtn') || document.querySelector('.header-login-btn');
                                    if (b) {
                                        b.className = 'header-login-btn logged-in';
                                        b.innerHTML = '<i class="fas fa-user-check"></i> ' + u.name;
                                        b.onclick = function () { if (typeof openLogoutModal === 'function') openLogoutModal(); };
                                    }
                                }
                            }
                        } catch (e) { }
                    })();
                </script>
            </div>
        </div>

            <!-- وصف السيرفر/الباقة -->
            <div class="app-note-box note-vip mb-30 d-none" id="server-description-box">

            </div>

            <h3 class="mb-20">أسعار الباقة:</h3>

            <div class="app-note-box note-vip mt-30">

                        اشتراكك في أسرع وقت.</b></p>
            </div>



        </section>
    </main>

    <footer>
        <div class="container footer-content">
            <!-- حقوق النشر -->
            <div class="copyright">

            <div class="social-icons">

                </a>
                <a href="https://facebook.com/ALMEZ0SERVERS" target="_blank" rel="noopener" title="Facebook">
                    <i class="fab fa-facebook-f"></i>

                <a href="https://wa.me/218945772649" target="_blank" rel="noopener" title="WhatsApp">
