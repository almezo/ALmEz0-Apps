    <script>
        // كشف فوري لمنصات التطبيقات (Capacitor / Electron / Standalone) لمنع ظهور عناصر التثبيت
        const isNativeEarly = !!(window.electronAPI?.isElectron || (window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform()) || window.navigator.standalone);
        if (isNativeEarly) {
            document.documentElement.classList.add('platform-native');
        }

        window.deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            if (isNativeEarly) return;
            e.preventDefault();
            window.deferredPrompt = e;
        });

        // تسجيل الـ Service Worker لتفعيل التثبيت (بدون حفظ كاش)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js').catch(function (error) {
                    console.log('Service Worker registration failed:', error);
                });
            });
        }
        // مسح الكاش كإجراء احترازي إضافي
        if ('caches' in window) {
            caches.keys().then(function (k) {
                k.forEach(function (key) { caches.delete(key); });
            });
        }
    </script>

            window.addEventListener('load', function() {
                setTimeout(function() {
                    splash.classList.add('splash-dismiss');
                    setTimeout(function() {
                        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
                    }, 550);
                }, 1600);
            });
            setTimeout(function() {
                if (splash && !splash.classList.contains('splash-dismiss')) {

    <script>
        function handlePlayerCardClick(event) {
            var isAuth = false;
            if (typeof isUserLoggedIn === 'function' && isUserLoggedIn()) {
                isAuth = true;
            } else {
                var cached = localStorage.getItem('almezo_cached_user') || sessionStorage.getItem('almezo_cached_user');
                if (cached) {
                    try {
                        var u = JSON.parse(cached);
                        if (u && (u.uid || u.phone || u.name)) isAuth = true;
                    } catch (e) { }
                }
            }

            if (!isAuth) {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                sessionStorage.setItem('almezo_redirect_to_player', '1');

                if (typeof openLoginModal === 'function') {
                    openLoginModal('login');
                }

                if (typeof showToast === 'function') {
                    showToast('يجب تسجيل الدخول أو إنشاء حساب أولاً لفتح مشغل الميزو', 'error', 4500);
                }
                return false;
            } else {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                var isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
                if ((window.AlMeZ0App && window.AlMeZ0App.isNative) || isLocalDev) {
                    if (window.AlMeZ0App && typeof window.AlMeZ0App.lockLandscape === 'function') {
                        window.AlMeZ0App.lockLandscape();
                    }
                    window.location.href = 'player.html';
                } else {
                    window.open('go-player.php', '_blank');
                }
                return true;
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Reset orientation to portrait on the main website
            if (window.AlMeZ0App && typeof window.AlMeZ0App.unlockOrientation === 'function') {
                window.AlMeZ0App.unlockOrientation();
            }
            window.addEventListener('pageshow', function () {
                if (window.AlMeZ0App && typeof window.AlMeZ0App.unlockOrientation === 'function') {
                    window.AlMeZ0App.unlockOrientation();
                }
            });

            var urlParams = new URLSearchParams(window.location.search);
            var isAuthReq = urlParams.get('auth_required') === 'player';
            var isPlayerLimit = urlParams.get('player_limit') === '1';
            var hasRedirect = sessionStorage.getItem('almezo_redirect_to_player') === '1';

            // Clean query params immediately so refreshing page will NEVER re-trigger
            if (isAuthReq || isPlayerLimit) {
                try {
                    window.history.replaceState({}, document.title, window.location.pathname);
                } catch (e) { }
            }
            if (hasRedirect) {
                sessionStorage.removeItem('almezo_redirect_to_player');
            }

            if (isPlayerLimit) {
                if (typeof showToast === 'function') {
                    showToast('⏳ انتهت مدة تجربة مشغل الميزو (10 دقائق). يرجى استخدام حسابك في السيرفر الأصلي، ويمكنك إعادة المحاولة في المشغل بعد ساعة واحدة.', 'info', 6000);
                }
            }

            if (isAuthReq || hasRedirect) {
                var isAuth = false;
                if (typeof isUserLoggedIn === 'function' && isUserLoggedIn()) {
                    isAuth = true;
                } else {
                    var cached = localStorage.getItem('almezo_cached_user') || sessionStorage.getItem('almezo_cached_user');
                    if (cached) {
                        try {
                            var u = JSON.parse(cached);
                            if (u && (u.uid || u.phone || u.name)) isAuth = true;
                        } catch (e) { }
                    }
                }

                if (!isAuth) {
                    setTimeout(function () {
                        if (typeof openLoginModal === 'function') {
                            openLoginModal('login');
                        }
                        if (typeof showToast === 'function') {
                            showToast('يجب تسجيل الدخول أو إنشاء حساب أولاً لفتح مشغل الميزو', 'error', 4500);
                        }
                    }, 300);
                } else {
                    var isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:';
                    if ((window.AlMeZ0App && window.AlMeZ0App.isNative) || isLocalDev) {
                        window.location.href = 'player.html';
                    } else {
                        window.open('go-player.php', '_blank');
                    }
                }
            }
        });
